<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>샌드위치 경매 CEO · 학생용 V2.11</title><link rel="stylesheet" href="style.css"></head><body><div class="wrap"><div class="hero"><h1>🥪 샌드위치 경매 CEO · 온라인 실시간 통합형 V2.11</h1><p>경매 전 계획 → 실시간 경매 → 경매 후 비교 → 상품 만들기 → 경제회의 → 남은 예산 → 스티커 → Padlet 공유</p></div>
<div id="needSetup" class="card hidden"><h2>연결 준비 중</h2><div class="warnbox">이 사이트의 Firebase 연결 설정이 아직 완료되지 않았습니다. 선생님께 알려 주세요.</div></div>
<div id="join" class="card hidden"><h2>수업방 입장</h2><div class="grid"><div class="field"><label>6자리 수업방 코드</label><input id="joinRoom" class="input" inputmode="numeric" maxlength="6" autocomplete="off" placeholder="예: 123456"></div><div class="field"><label>우리 조</label><select id="joinTeam"></select></div></div><button id="joinBtn" class="btn">수업방 입장</button><div id="joinMsg" class="notice">선생님이 보여준 방 코드와 우리 조를 선택하세요.</div></div>
<div id="app" class="hidden"><div class="card"><div class="topbar"><div class="controls"><span>우리 조</span><select id="teamSelect" style="width:auto;min-width:110px"></select><button id="resetActivity" class="btn light">🧹 활동기록 초기화</button></div><div><span class="pill">방 <b id="roomLabel">-</b></span> <span class="money">남은 가상예산 <span id="budget">0원</span></span></div></div></div>
<div class="tabs" id="tabs"><button class="tab on" data-step="1">1. 경매 전 계획</button><button class="tab" data-step="0">⚡ 실시간 경매</button><button class="tab" data-step="2">2. 경매 후 비교</button><button class="tab" data-step="3">3. 우리 조 상품</button><button class="tab" data-step="4">4. 경제회의</button><button class="tab" data-step="5">5. 남은 예산</button><button class="tab" data-step="6">6. 스티커</button><button class="tab" data-step="7">7. Padlet 공유</button></div>
<div id="content"></div></div></div>
<script src="firebase-config.js"></script><script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-app-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-auth-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-database-compat.js"></script><script src="common.js"></script><script src="student.js"></script></body></html>
